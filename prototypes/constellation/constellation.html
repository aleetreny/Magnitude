<title>Magnitude Constellation</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a10;
               font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
               -webkit-font-smoothing: antialiased; }
  #stage { position: fixed; inset: 0; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #stage.over { cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }

  .layer { position: fixed; inset: 0; pointer-events: none; }

  /* The question that follows the cursor across the sky. */
  #tip { position: absolute; transform: translate(-50%, -100%);
         padding: 0 0 12px; text-align: center; white-space: nowrap;
         font-size: 15px; letter-spacing: 0.01em; color: #eef3fa;
         opacity: 0; transition: opacity 140ms linear; text-shadow: 0 1px 12px rgba(0,0,0,0.9); }
  #tip.on { opacity: 1; }
  #tip small { display: block; padding-top: 5px; font-size: 10px; letter-spacing: 0.16em;
               text-transform: uppercase; color: #7d8ea6; }

  /* The open star: its question above the chart, its source below. */
  #head { position: absolute; left: 50%; transform: translateX(-50%);
          top: max(22px, env(safe-area-inset-top)); width: min(760px, 88vw); text-align: center;
          opacity: 0; transition: opacity 220ms linear; }
  #head.on { opacity: 1; }
  #head h1 { margin: 0; font-size: clamp(19px, 3.4vw, 30px); font-weight: 400;
             letter-spacing: -0.012em; line-height: 1.2; color: #f2f6fb; }
  /* What the cursor is on, inside an open chart. The only text a chart adds. */
  #read { position: absolute; left: 50%; transform: translateX(-50%);
          top: calc(max(22px, env(safe-area-inset-top)) + 46px); width: min(760px, 88vw);
          text-align: center; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
          color: #b8c6d8; opacity: 0; transition: opacity 120ms linear;
          text-shadow: 0 1px 10px rgba(0,0,0,0.9); }
  #read.on { opacity: 1; }

  #foot { position: absolute; left: 50%; transform: translateX(-50%);
          bottom: max(20px, env(safe-area-inset-bottom)); width: min(760px, 88vw); text-align: center;
          font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: #7d8ea6;
          opacity: 0; transition: opacity 220ms linear; }
  #foot.on { opacity: 1; }

  /* The whole constellation, always available while you are inside one star. */
  #map { position: absolute; left: max(18px, env(safe-area-inset-left));
         bottom: max(18px, env(safe-area-inset-bottom)); width: 148px; height: 78px;
         opacity: 0; transition: opacity 260ms linear; pointer-events: none; }
  #map.on { opacity: 1; pointer-events: auto; }
  #map canvas { cursor: pointer; }

  #wordmark { position: absolute; left: max(18px, env(safe-area-inset-left));
              top: max(18px, env(safe-area-inset-top)); display: inline-flex; align-items: baseline;
              gap: 1px; line-height: 1; color: #cbd6e6; opacity: 0.85; }
  #wordmark span { display: block; }

  #hint { position: absolute; right: max(18px, env(safe-area-inset-right));
          top: max(20px, env(safe-area-inset-top)); font-size: 10px; letter-spacing: 0.16em;
          text-transform: uppercase; color: #5d6c80; transition: opacity 300ms linear; }

  /* Narrow screens: the wordmark stays where it is, so the question moves
     under it and the constellation goes to the other corner, where it cannot
     land on the source line when that wraps to two lines. */
  @media (max-width: 700px) {
    #head { top: 88px; width: 92vw; }
    #read { top: 130px; }
    #hint { display: none; }
    #foot { width: 92vw; font-size: 9.5px; letter-spacing: 0.09em; }
    #map { left: auto; bottom: auto;
           right: max(14px, env(safe-area-inset-right));
           top: max(14px, env(safe-area-inset-top));
           width: 104px; height: 56px; }
  }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);
        white-space: nowrap; }
  .sr button { position: static; }
</style>

/* =====================================================================
 * A constellation you fly through.
 *
 * Everything here is three-dimensional and projected by hand. That is the
 * whole point: a flat map zoomed in and out can only ever slide, and sliding
 * is what tells you it is a web page. Stars at real depths stream past at
 * different rates, the near ones tearing by while the far ones hold still,
 * and that difference is what the eye reads as travel.
 *
 * The sky is in two halves. A deep field of two thousand stars sits so far
 * out that nothing you do moves it: that is the sky, and it is why the
 * constellation is still the same shape after a journey. A nearer drift field
 * is recycled as you pass it, so the travel never runs out of space.
 * ===================================================================== */

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage = document.getElementById('stage');
const cv = document.getElementById('sky');
const ctx = cv.getContext('2d', { alpha: false });
const tip = document.getElementById('tip');
const head = document.getElementById('head');
const headline = head.querySelector('h1');
const readEl = document.getElementById('read');
const foot = document.getElementById('foot');
const mapBox = document.getElementById('map');
const mapCv = mapBox.querySelector('canvas');
const mapCtx = mapCv.getContext('2d');
const hint = document.getElementById('hint');

let W = 0, H = 0, DPR = 1;
/** A third-size buffer that everything bright is drawn into, blurred once and
 *  laid back over the scene. One pass, and it is what turns points of light
 *  into light. */
const glowCv = document.createElement('canvas');
const glow = glowCv.getContext('2d');

const stars = DATA.stars;
const byId = Object.fromEntries(stars.map((s) => [s.id, s]));

let seed = 20260821;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
const rr = (a, b) => a + rnd() * (b - a);

/* ------------------------------------------------------------------ camera */
const cam = { x: 0, y: 0, z: -9000, yaw: 0, pitch: 0, roll: 0, focal: 1000 };
let prev = { x: 0, y: 0, z: -9000 };
let speed = 0;          // world units per frame, smoothed
let shake = 0;

function project(px, py, pz) {
  const dx = px - cam.x, dy = py - cam.y, dz = pz - cam.z;
  const cy = Math.cos(-cam.yaw), sy = Math.sin(-cam.yaw);
  const x1 = dx * cy - dz * sy;
  const z1 = dx * sy + dz * cy;
  const cp = Math.cos(-cam.pitch), sp = Math.sin(-cam.pitch);
  const y1 = dy * cp - z1 * sp;
  const z2 = dy * sp + z1 * cp;
  if (z2 <= 40) return null;
  const k = cam.focal / z2;
  const ax = x1 * k, ay = y1 * k;
  const cr = Math.cos(cam.roll), sr = Math.sin(cam.roll);
  return { x: W / 2 + ax * cr - ay * sr, y: H / 2 + ax * sr + ay * cr, z: z2, k };
}

/* ------------------------------------------------------------------- field */
const deep = [];      // the sky itself: too far to move
const drift = [];     // the near field: recycled as it goes past

/** Real star colours run blue-white through yellow to red, and a sky of one
 *  hue looks printed rather than photographed. */
const TEMPERATURE = ['#cfe0ff', '#e6efff', '#ffffff', '#fff4e0', '#ffe2b8', '#ffcda0', '#ffb99a'];

function buildField() {
  deep.length = 0; drift.length = 0;
  for (let i = 0; i < 3200; i++) {
    // On a shell around everything, so the sky is behind you as well as ahead.
    // Half of it is always off screen, which is what a sky is.
    const band = rnd() < 0.46;                    // the galaxy has to be somewhere
    const u = rr(-1, 1);
    const th = rr(0, 6.283185);
    const r = rr(50000, 135000);
    const flat = band ? 0.13 : 1;
    const sx = Math.sqrt(1 - u * u) * Math.cos(th);
    const sy = u * flat + (band ? rr(-0.07, 0.07) : 0);
    const sz = Math.sqrt(1 - u * u) * Math.sin(th);
    deep.push({
      x: sx * r, y: sy * r, z: sz * r,
      m: Math.pow(rnd(), band ? 2.9 : 2.1),
      c: TEMPERATURE[(rnd() * TEMPERATURE.length) | 0],
      p: rr(0, 6.283), w: rr(0.4, 1.9),
    });
  }
  for (let i = 0; i < 1000; i++) drift.push(seedDrift(true));
}

function seedDrift(anywhere) {
  const ahead = anywhere ? rr(600, 26000) : rr(20000, 27000);
  return {
    x: cam.x + rr(-16000, 16000),
    y: cam.y + rr(-12000, 12000),
    z: cam.z + ahead,
    m: Math.pow(rnd(), 1.8),
    c: TEMPERATURE[(rnd() * TEMPERATURE.length) | 0],
    p: rr(0, 6.283),
  };
}

/* ------------------------------------------------------------------ nebulae
 * Painted once into offscreen tiles, then hung in space at different depths.
 * Generating cloud on the fly every frame is the expensive way to do a thing
 * that never changes. */
const clouds = [];
function paintCloud(hue, size) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 190; i++) {
    const x = rr(0, size), y = rr(0, size);
    const r = rr(size * 0.04, size * 0.3);
    const d = Math.hypot(x - size / 2, y - size / 2) / (size / 2);
    const a = Math.max(0, 0.15 * (1 - d * 0.8)) * rr(0.35, 1);
    const rad = g.createRadialGradient(x, y, 0, x, y, r);
    rad.addColorStop(0, `hsla(${hue + rr(-16, 16)}, ${rr(45, 85)}%, ${rr(46, 68)}%, ${a})`);
    rad.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = rad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // A few dark lanes, because a cloud with no shadow reads as a smudge.
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 26; i++) {
    const x = rr(0, size), y = rr(0, size), r = rr(size * 0.05, size * 0.24);
    const rad = g.createRadialGradient(x, y, 0, x, y, r);
    rad.addColorStop(0, `rgba(0,0,0,${rr(0.25, 0.75)})`);
    rad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rad;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // Feather the tile away to nothing at its edges. Without this the cloud is a
  // square, and the moment you see the square the sky stops being a sky.
  g.globalCompositeOperation = 'destination-in';
  const mask = g.createRadialGradient(size / 2, size / 2, size * 0.06, size / 2, size / 2, size * 0.5);
  mask.addColorStop(0, 'rgba(0,0,0,1)');
  mask.addColorStop(0.62, 'rgba(0,0,0,0.72)');
  mask.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = mask;
  g.fillRect(0, 0, size, size);
  // One soft pass. A tile blown up to forty thousand units across shows every
  // blob it was built from otherwise, and blobs at that scale read as pattern.
  const out = document.createElement('canvas');
  out.width = out.height = size;
  const o = out.getContext('2d');
  o.filter = `blur(${(size / 26).toFixed(1)}px)`;
  o.drawImage(c, 0, 0);
  return out;
}

function buildClouds() {
  clouds.length = 0;
  const set = [[228, 1.15], [268, 0.8], [204, 1.35], [318, 0.6], [186, 0.9],
               [246, 1.05], [292, 0.7], [212, 0.85]];
  set.forEach(([hue, scale]) => {
    clouds.push({
      img: paintCloud(hue, 640),
      x: rr(-52000, 52000), y: rr(-26000, 26000), z: rr(-30000, 92000),
      size: 44000 * scale, a: rr(0.45, 1),
    });
  });
  clouds.sort((a, b) => b.z - a.z);
}

/* ------------------------------------------------------------------- grain */
let grainImg = null;
function paintGrain() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  const d = g.createImageData(s, s);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 122 + (rnd() * 52 - 26);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
    d.data[i + 3] = 255;
  }
  g.putImageData(d, 0, 0);
  grainImg = c;
}

/* ===================================================================== trip
 * A journey is not a tween between two camera positions. It is four moves:
 * you turn to face the thing, you go, the light of arriving blinds you for a
 * moment, and then you are somewhere else. Each leg has its own job and its
 * own curve, and the flash is what lets the sky become a different sky
 * without the eye catching the join.
 */
const ease = {
  out: (t) => 1 - Math.pow(1 - t, 3),
  inOut: (t) => (t < 0.5 ? 16 * t * t * t * t * t : 1 - Math.pow(-2 * t + 2, 5) / 2),
  back: (t) => 1 + 2.2 * Math.pow(t - 1, 3) + 1.4 * Math.pow(t - 1, 2),
  soft: (t) => t * t * (3 - 2 * t),
};
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const mix = (a, b, t) => a + (b - a) * t;

let trip = null;
let inStar = null;         // the star we have arrived at
let world = 0;             // 0 the open sky, 1 inside a star's own world
let flash = 0;
let assembly = 0;          // how far the chart has come together
let idle = 0;

/** How far back the camera has to sit for the whole constellation to fit. */
function skyCam() {
  let r = 0;
  for (const s of stars) r = Math.max(r, Math.hypot(s.at[0], s.at[1]) );
  const back = (r * 1.55 * cam.focal) / (Math.min(W, H) * 0.42);
  let zc = 0;
  for (const s of stars) zc += s.at[2];
  zc /= stars.length;
  return { x: 0, y: 0, z: zc - back, yaw: 0, pitch: 0, roll: 0 };
}

/** Where the camera stands to read one star's chart, straight on. */
function readCam(s) {
  const b = band();
  const half = Math.max((s.box[0] / 2) * CHART_R / (W * 0.46),
                        (s.box[1] / 2) * CHART_R / (b.h * 0.46));
  const d = cam.focal * half;
  const lift = ((b.top + b.h / 2) - H / 2) / cam.focal * d;
  return { x: s.at[0] + s.mid[0] * CHART_R, y: s.at[1] + s.mid[1] * CHART_R - lift,
           z: s.at[2] - d, yaw: 0, pitch: 0, roll: 0 };
}

function aimAt(from, to) {
  const ax = to.x - from.x, ay = to.y - from.y, az = to.z - from.z;
  return { yaw: Math.atan2(ax, az), pitch: -Math.atan2(ay, Math.hypot(ax, az)) };
}

function travel(target) {
  const to = target ? readCam(target) : skyCam();
  const from = { x: cam.x, y: cam.y, z: cam.z, yaw: cam.yaw, pitch: cam.pitch, roll: cam.roll };
  const aim = aimAt(from, to);

  // The path is a cubic, not a straight line and not a single arc. The first
  // control point sits BEHIND where you are standing, so the camera retreats
  // before it commits; the second sits behind the target, so it comes in along
  // the star's own axis rather than sideswiping it. Between them the camera
  // covers three or four times the distance between the two points, and that
  // extra distance is the whole reason the journey reads as travel: five
  // hundred units of drift is a pan, six thousand is a flight.
  const dx = to.x - from.x, dy = to.y - from.y, dz = to.z - from.z;
  const dist = Math.hypot(dx, dy, dz);
  const len = dist || 1;
  const ux = dx / len, uy = dy / len, uz = dz / len;
  let px = -uz, py = 0.44, pz = ux;                  // a perpendicular, tilted up
  const pl = Math.hypot(px, py, pz) || 1;
  px /= pl; py /= pl; pz /= pl;

  // Where the camera is looking now, so the retreat goes backwards from here.
  const fy = Math.cos(from.yaw) * Math.cos(from.pitch);
  const fx = Math.sin(from.yaw) * Math.cos(from.pitch);
  const fv = -Math.sin(from.pitch);
  const back = Math.max(3600, dist * 1.05);
  const bow = Math.max(2600, dist * 0.55) * (target ? 1 : 0.7);

  const c1 = { x: from.x - fx * back + px * bow * 0.5,
               y: from.y - fv * back + py * bow * 0.5,
               z: from.z - fy * back + pz * bow * 0.5 };
  const c2 = { x: to.x + px * bow - ux * back * 0.35,
               y: to.y + py * bow - uy * back * 0.35,
               z: to.z + pz * bow - uz * back * 0.35 };

  // Rough arc length, so a long haul is given longer to happen.
  let arc = 0, ax = from.x, ay = from.y, az = from.z;
  for (let i = 1; i <= 16; i++) {
    const t = i / 16, it = 1 - t;
    const bx = it * it * it * from.x + 3 * it * it * t * c1.x + 3 * it * t * t * c2.x + t * t * t * to.x;
    const by = it * it * it * from.y + 3 * it * it * t * c1.y + 3 * it * t * t * c2.y + t * t * t * to.y;
    const bz = it * it * it * from.z + 3 * it * it * t * c1.z + 3 * it * t * t * c2.z + t * t * t * to.z;
    arc += Math.hypot(bx - ax, by - ay, bz - az);
    ax = bx; ay = by; az = bz;
  }

  // A hook for looking at the thing frame by frame while building it.
  const slow = (typeof window !== 'undefined' && window.__slow) || 1;
  const legs = {
    turn: reduced ? 0 : 460 * slow,
    warp: reduced ? 0 : Math.max(1500, Math.min(3200, 900 + arc * 0.055)) * slow,
    flash: reduced ? 0 : 300 * slow,
    settle: reduced ? 0 : (target ? 1150 : 700) * slow,
  };
  trip = {
    t0: performance.now(), from, to, c1, c2, arc, aim, target, legs, worldFrom: world,
    total: legs.turn + legs.warp + legs.flash + legs.settle,
    // Banking: the harder the turn, the more the horizon tips.
    roll: Math.max(-0.42, Math.min(0.42, wrap(aim.yaw - from.yaw) * 0.55)),
  };
  if (target) { inStar = target; } else { inStar = null; }
  if (reduced) { Object.assign(cam, to); world = target ? 1 : 0; assembly = target ? 1 : 0; trip = null; chrome(); }
}

const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
const angle = (a, b, t) => a + wrap(b - a) * t;

function runTrip(now) {
  const e = now - trip.t0;
  const { legs, from, to, aim } = trip;
  const going = !!trip.target;

  // 1 · turn to face it
  if (e < legs.turn) {
    const t = ease.soft(e / legs.turn);
    cam.yaw = angle(from.yaw, aim.yaw, t);
    cam.pitch = angle(from.pitch, aim.pitch, t);
    cam.roll = mix(from.roll, trip.roll, t);
    flash = 0;
    return;
  }
  // 2 · go
  const e2 = e - legs.turn;
  if (e2 < legs.warp) {
    const raw = e2 / legs.warp;
    const t = ease.inOut(raw);
    const it = 1 - t;
    const { c1, c2 } = trip;
    cam.x = it*it*it*from.x + 3*it*it*t*c1.x + 3*it*t*t*c2.x + t*t*t*to.x;
    cam.y = it*it*it*from.y + 3*it*it*t*c1.y + 3*it*t*t*c2.y + t*t*t*to.y;
    cam.z = it*it*it*from.z + 3*it*it*t*c1.z + 3*it*t*t*c2.z + t*t*t*to.z;
    // Straighten up on the way in, and punch the field of view at full speed.
    const s = ease.soft(clamp01((raw - 0.35) / 0.65));
    cam.yaw = angle(aim.yaw, to.yaw, s);
    cam.pitch = angle(aim.pitch, to.pitch, s);
    cam.roll = mix(trip.roll, 0, s);
    const punch = Math.sin(raw * Math.PI);
    cam.focal = FOCAL * (1 - 0.34 * punch);
    shake = punch * 1.6;
    if (going) world = Math.max(trip.worldFrom * (1 - raw), clamp01((raw - 0.7) / 0.3) * 0.35);
    else { world = mix(trip.worldFrom, 0, ease.soft(clamp01(raw / 0.5))); assembly = 0; }
    return;
  }
  // 3 · the light of arriving
  const e3 = e2 - legs.warp;
  cam.x = to.x; cam.y = to.y; cam.z = to.z;
  cam.yaw = to.yaw; cam.pitch = to.pitch; cam.roll = to.roll;
  cam.focal = FOCAL;
  if (e3 < legs.flash) {
    const t = e3 / legs.flash;
    flash = going ? Math.sin(Math.min(1, t * 1.6) * Math.PI) : Math.sin(t * Math.PI) * 0.5;
    if (going) world = mix(0.35, 1, ease.out(t));
    assembly = 0;
    shake = (1 - t) * 2.2;
    return;
  }
  // 4 · and then you are somewhere else
  const e4 = e3 - legs.flash;
  flash = Math.max(0, 1 - e4 / 260) * (going ? 0.5 : 0.2);
  shake = 0;
  if (going) { world = 1; assembly = clamp01(e4 / legs.settle); }
  else { world = 0; assembly = 0; }
  if (e4 >= legs.settle) { trip = null; assembly = going ? 1 : 0; flash = 0; }
  chrome();
}

function chrome() {
  const open = !!inStar && world > 0.7 && assembly > 0.25;
  head.classList.toggle('on', open);
  foot.classList.toggle('on', open);
  mapBox.classList.toggle('on', world > 0.35);
  hint.style.opacity = world > 0.2 || trip ? 0 : 0.9;
  if (open) { headline.textContent = inStar.q; foot.textContent = inStar.src; }
  else { readEl.classList.remove('on'); readNow = null; }
}

/* ==================================================================== paint */
const CHART_R = 1100;
let FOCAL = 1000;
let CHROME_TOP = 108, CHROME_BOTTOM = 72;

function band() {
  const top = Math.min(CHROME_TOP, H * 0.17);
  const bottom = Math.min(CHROME_BOTTOM, H * 0.12);
  return { top, bottom, h: Math.max(140, H - top - bottom) };
}

/** The two skies the background crossfades between. */
const SKY_TOP = [10, 15, 26], SKY_LOW = [4, 6, 12];
const hexRGB = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const rgb = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;
const lerp3 = (a, b, t) => [mix(a[0], b[0], t), mix(a[1], b[1], t), mix(a[2], b[2], t)];

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  // Hold the last painted frame. Only ever set while looking at the thing.
  if (typeof window !== 'undefined' && window.__hold) { last = now; return; }
  // Speed is measured per millisecond, not per frame. A frame that took a
  // quarter of a second, because the tab was busy, is not the camera moving
  // fast, and treating it as such smears the whole screen for no reason.
  const dt = last ? Math.max(4, now - last) : 16.7;
  last = now;
  if (trip) runTrip(now);
  else if (!inStar) {
    idle += 1;
    if (idle > 220) { cam.yaw += 0.00007; cam.pitch += Math.sin(now / 9000) * 0.000018; }
  }
  const dm = Math.hypot(cam.x - prev.x, cam.y - prev.y, cam.z - prev.z) * (16.7 / dt);
  speed = speed * 0.8 + dm * 0.2;
  prev = { x: cam.x, y: cam.y, z: cam.z };
  draw(now);
}

function draw(now) {
  const jitter = shake ? (rnd() - 0.5) * shake : 0;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  glow.setTransform(DPR / 3, 0, 0, DPR / 3, 0, 0);
  glow.clearRect(0, 0, W, H);

  const tint = inStar ? hexRGB(inStar.tint) : SKY_TOP;
  const top = lerp3(SKY_TOP, [tint[0] * 0.11, tint[1] * 0.11, tint[2] * 0.14], world);
  const low = lerp3(SKY_LOW, [tint[0] * 0.05, tint[1] * 0.05, tint[2] * 0.07], world);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgb(top));
  g.addColorStop(1, rgb(low));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  drawClouds();
  drawWorldLight();
  drawDeep(now);
  drawMotes(now);
  drawDrift();
  ctx.globalCompositeOperation = 'source-over';
  drawEdges();
  for (const s of stars) drawStar(s, now, jitter);
  if (world > 0.02 && inStar) drawChart(inStar);

  // One blurred pass of everything bright, laid back over the scene.
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  const rush = clamp01(speed / 95);
  const calm = world > 0.9 && !trip ? 0.34 : 1;
  ctx.filter = `blur(${(9 + rush * 18).toFixed(1)}px)`;
  ctx.globalAlpha = Math.min(1, (0.42 + rush * 0.5 + flash * 0.5) * calm + 0.1);
  ctx.drawImage(glowCv, 0, 0, cv.width, cv.height);
  // At speed the lens gives up on holding the colours together.
  if (rush > 0.06) {
    ctx.globalAlpha = rush * 0.5;
    ctx.drawImage(glowCv, -rush * 22 * DPR, 0, cv.width, cv.height);
    ctx.drawImage(glowCv, rush * 22 * DPR, 0, cv.width, cv.height);
  }
  ctx.filter = 'none';
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  if (flash > 0.002) drawFlash();
  drawVignette(rush);
  if (grainImg) {
    ctx.globalAlpha = 0.014;
    ctx.globalCompositeOperation = 'overlay';
    const p = ctx.createPattern(grainImg, 'repeat');
    ctx.fillStyle = p;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  drawMap();
}

/** The star, behind its own chart, lighting the room. */
function drawWorldLight() {
  if (world < 0.02 || !inStar) return;
  const p = project(inStar.at[0], inStar.at[1], inStar.at[2] + 400);
  if (!p) return;
  const r = Math.hypot(W, H) * 0.85;
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
  g.addColorStop(0, hexA(inStar.tint, 0.115 * world));
  g.addColorStop(0.45, hexA(inStar.tint, 0.04 * world));
  g.addColorStop(1, hexA(inStar.tint, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

/** Motes hanging in the light. Nothing carries "you are somewhere" like dust
 *  that drifts while you stand still. */
const motes = [];
function buildMotes() {
  motes.length = 0;
  for (let i = 0; i < 220; i++) {
    motes.push({ x: rr(-1, 1), y: rr(-1, 1), z: rr(-1, 1),
                 r: rr(0.6, 2.6), a: rr(0.15, 0.85), p: rr(0, 6.283), s: rr(0.25, 1.1) });
  }
}
function drawMotes(now) {
  if (world < 0.05 || !inStar) return;
  const R = CHART_R * 1.9;
  for (const m of motes) {
    const wob = Math.sin(now / 2600 * m.s + m.p);
    const p = project(inStar.at[0] + m.x * R + wob * 30,
                      inStar.at[1] + m.y * R * 0.72 + Math.cos(now / 3100 * m.s + m.p) * 26,
                      inStar.at[2] + m.z * R * 0.8 - 300);
    if (!p) continue;
    // Dust is dust: a couple of pixels, whatever the camera is doing. Scaling
    // it with perspective turns the room into a bokeh photograph.
    ctx.globalAlpha = m.a * world * 0.16 * (0.5 + 0.5 * wob);
    ctx.fillStyle = inStar.tint;
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(0.5, Math.min(2.6, m.r * (0.5 + p.k * 2.2))), 0, 6.283185);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawClouds() {
  for (const c of clouds) {
    const p = project(c.x, c.y, c.z);
    if (!p) continue;
    const s = c.size * p.k;
    if (s < 12 || p.x + s < -200 || p.x - s > W + 200 || p.y + s < -200 || p.y - s > H + 200) continue;
    ctx.globalAlpha = c.a * (0.9 - world * 0.6);
    ctx.drawImage(c.img, p.x - s / 2, p.y - s / 2, s, s);
  }
  if (inStar && world > 0.02) {
    const c = inStar.cloud;
    for (const [dz, scale, a] of [[11000, 52000, 0.3], [4200, 22000, 0.22], [21000, 88000, 0.2]]) {
      const p = project(inStar.at[0] + (dz % 700) - 350, inStar.at[1] + (dz % 400) - 200, inStar.at[2] + dz);
      if (!p) continue;
      const s = scale * p.k;
      ctx.globalAlpha = world * a;
      ctx.drawImage(c, p.x - s / 2, p.y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

function drawDeep(now) {
  for (const d of deep) {
    const p = project(d.x, d.y, d.z);
    if (!p || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) continue;
    const tw = 0.68 + 0.32 * Math.sin(now / 1200 * d.w + d.p);
    ctx.globalAlpha = (0.3 + d.m * 0.85) * tw * (1 - world * 0.5);
    ctx.fillStyle = d.c;
    const r = 0.55 + d.m * 1.9;
    ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
  }
  ctx.globalAlpha = 1;
}

function drawDrift() {
  const streak = clamp01(speed / 26);
  for (let i = 0; i < drift.length; i++) {
    const d = drift[i];
    const p = project(d.x, d.y, d.z);
    if (!p || p.z > 30000) { if (p && p.z > 30000) continue; drift[i] = seedDrift(false); continue; }
    if (p.x < -300 || p.x > W + 300 || p.y < -300 || p.y > H + 300) {
      if (p.z < 900) drift[i] = seedDrift(false);
      continue;
    }
    const near = clamp01(1 - p.z / 26000);
    const a = (0.1 + d.m * 0.8) * near * (1 - world * 0.72);
    if (a < 0.01) continue;
    const len = streak * near * (900 / Math.max(400, p.z)) * 420;
    ctx.globalAlpha = a;
    if (len > 1.5) {
      let vx = p.x - W / 2, vy = p.y - H / 2;
      const vl = Math.hypot(vx, vy) || 1;
      vx /= vl; vy /= vl;
      const gr = ctx.createLinearGradient(p.x, p.y, p.x - vx * len, p.y - vy * len);
      gr.addColorStop(0, d.c);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = gr;
      ctx.lineWidth = Math.max(0.7, 1.5 * near);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - vx * len, p.y - vy * len);
      ctx.stroke();
    } else {
      ctx.fillStyle = d.c;
      const r = 0.5 + d.m * 1.7 * near;
      ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
    }
  }
  ctx.globalAlpha = 1;
}

function drawEdges() {
  if (world > 0.75) return;
  ctx.lineWidth = 1;
  for (const e of DATA.edges) {
    const a = byId[e.a], b = byId[e.b];
    const pa = project(a.at[0], a.at[1], a.at[2]);
    const pb = project(b.at[0], b.at[1], b.at[2]);
    if (!pa || !pb) continue;
    const lit = hover && (hover.id === e.a || hover.id === e.b);
    const gr = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
    const A = (lit ? 0.5 : 0.17) * (1 - world) * (1 - clamp01(speed / 90));
    gr.addColorStop(0, `rgba(150,178,214,${A})`);
    gr.addColorStop(0.5, `rgba(150,178,214,${A * 0.42})`);
    gr.addColorStop(1, `rgba(150,178,214,${A})`);
    ctx.strokeStyle = gr;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }
}

/** A bright star, with the flare a lens gives one. */
function drawStar(s, now, jitter) {
  const p = project(s.at[0], s.at[1], s.at[2]);
  if (!p) return;
  const here = inStar === s;
  const shut = here ? 1 - clamp01(assembly * 1.5) : 1 - world * 0.9;
  if (shut <= 0.001) return;
  const near = clamp01(3400 / p.z);
  const tw = 0.9 + 0.1 * Math.sin(now / 900 + s.at[0]);
  const lit = (hover === s ? 1.5 : 1) * tw * shut;
  const core = (1.6 + near * 4.2) * lit;
  const spike = (26 + near * 150) * lit;

  for (const target of [ctx, glow]) {
    target.globalCompositeOperation = 'lighter';
    const rg = target.createRadialGradient(p.x + jitter, p.y, 0, p.x + jitter, p.y, spike * 0.62);
    rg.addColorStop(0, s.tint);
    rg.addColorStop(0.28, s.tint + '99');
    rg.addColorStop(1, s.tint + '00');
    target.globalAlpha = 0.62 * lit;
    target.fillStyle = rg;
    target.beginPath();
    target.arc(p.x + jitter, p.y, spike * 0.62, 0, 6.283185);
    target.fill();

    target.globalAlpha = 0.5 * lit;
    target.lineWidth = Math.max(0.6, 1.1 * lit);
    for (const [ax, ay, l] of [[1, 0, 1], [0, 1, 1], [0.707, 0.707, 0.42], [0.707, -0.707, 0.42]]) {
      const L = spike * l;
      const gr = target.createLinearGradient(p.x - ax * L, p.y - ay * L, p.x + ax * L, p.y + ay * L);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.5, s.tint);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      target.strokeStyle = gr;
      target.beginPath();
      target.moveTo(p.x - ax * L + jitter, p.y - ay * L);
      target.lineTo(p.x + ax * L + jitter, p.y + ay * L);
      target.stroke();
    }

    target.globalAlpha = lit;
    target.fillStyle = '#ffffff';
    target.beginPath();
    target.arc(p.x + jitter, p.y, core, 0, 6.283185);
    target.fill();
    target.globalAlpha = 1;
    target.globalCompositeOperation = 'source-over';
  }
}

/* =============================================================== the chart
 * The marks are not laid on top of the scene, they are in it: points in the
 * same space as the stars, on the plane the star stands on. That is what
 * makes the arrival one move instead of two, and it is why the chart has
 * perspective while it is coming together and none once it has.
 */
function drawChart(s) {
  const a = assembly;
  if (a <= 0.001) return;
  const alpha = clamp01(a * 2.4);

  for (const m of s.marks) {
    const mt = ease.back(clamp01((a - m.lag) / (1 - m.lag)));
    if (mt <= 0.001) continue;
    const pz = s.at[2] + (1 - mt) * m.zo;
    const p = project(s.at[0] + m.x * CHART_R * mt, s.at[1] + m.y * CHART_R * mt, pz);
    if (!p) continue;
    const grow = Math.min(1, mt * 1.4);
    ctx.globalAlpha = alpha * Math.min(1, mt * 2);
    ctx.fillStyle = m.c || s.tint;
    // Only while it is still flying does a mark carry its own light.
    glow.globalAlpha = ctx.globalAlpha * 0.5 * (1 - clamp01((a - 0.55) / 0.4));
    glow.fillStyle = ctx.fillStyle;
    if (m.k === 'r') {
      const w = Math.max(1, m.w * CHART_R * p.k * grow);
      const h = Math.max(1, m.h * CHART_R * p.k * grow);
      ctx.fillRect(p.x - w / 2, p.y - h / 2, w, h);
      glow.fillRect(p.x - w / 2, p.y - h / 2, w, h);
    } else {
      const r = Math.max(0.8, m.r * CHART_R * p.k * grow);
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283185); ctx.fill();
      glow.beginPath(); glow.arc(p.x, p.y, r, 0, 6.283185); glow.fill();
    }
  }
  ctx.globalAlpha = 1;
  glow.globalAlpha = 1;

  // The furniture arrives last, once the marks have stopped moving.
  const fa = clamp01((a - 0.62) / 0.3);
  if (fa <= 0.002 || !s.axes) return;
  const at = (q) => project(s.at[0] + q[0] * CHART_R, s.at[1] + q[1] * CHART_R, s.at[2]);
  ctx.strokeStyle = '#8ea3bd';
  ctx.lineWidth = 1;
  ctx.globalAlpha = fa * 0.5;
  for (const ax of s.axes) {
    if (ax.k === 'line') {
      const p1 = at(ax.a), p2 = at(ax.b);
      if (!p1 || !p2) continue;
      // The rules draw themselves on rather than blinking into place.
      const t = clamp01((fa - 0.1) / 0.9);
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(mix(p1.x, p2.x, t), mix(p1.y, p2.y, t));
      ctx.stroke();
    } else if (ax.k === 'circle') {
      const c = project(s.at[0], s.at[1], s.at[2]);
      if (!c) continue;
      ctx.beginPath();
      ctx.arc(c.x, c.y, ax.r * CHART_R * c.k, -Math.PI / 2, -Math.PI / 2 + 6.283185 * fa);
      ctx.stroke();
    }
  }
  const c0 = project(s.at[0], s.at[1], s.at[2]);
  const size = c0 ? Math.max(9, Math.min(15, CHART_R * c0.k * 0.031)) : 11;
  ctx.font = `${size}px 'Helvetica Neue', Helvetica, Arial, sans-serif`;
  ctx.textBaseline = 'middle';
  for (const ax of s.axes) {
    if (ax.k !== 'text') continue;
    const p = at(ax.at);
    if (!p) continue;
    ctx.globalAlpha = fa * (ax.lit ? 0.95 : 0.62);
    ctx.fillStyle = ax.lit ? '#e8f0fa' : '#93a7c0';
    ctx.textAlign = ax.al || 'center';
    ctx.fillText(ax.s, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';
}

function drawFlash() {
  const s = inStar || trip?.target;
  const p = s ? project(s.at[0], s.at[1], s.at[2]) : null;
  const cxp = p ? p.x : W / 2, cyp = p ? p.y : H / 2;
  const r = Math.hypot(W, H) * (0.28 + flash * 0.95);
  const g = ctx.createRadialGradient(cxp, cyp, 0, cxp, cyp, r);
  const tint = s ? s.tint : '#ffffff';
  g.addColorStop(0, `rgba(255,255,255,${flash})`);
  g.addColorStop(0.25, `rgba(255,255,255,${flash * 0.7})`);
  g.addColorStop(0.6, hexA(tint, flash * 0.3));
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
}
const hexA = (h, a) => `rgba(${hexRGB(h).join(',')},${a})`;

function drawVignette(rush) {
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28,
                                     W / 2, H / 2, Math.hypot(W, H) * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, `rgba(0,0,0,${0.5 + rush * 0.32})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawMap() {
  const w = mapCv.width / DPR, h = mapCv.height / DPR;
  mapCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  mapCtx.clearRect(0, 0, w, h);
  if (world <= 0.3) return;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const s of stars) {
    x0 = Math.min(x0, s.at[0]); x1 = Math.max(x1, s.at[0]);
    y0 = Math.min(y0, s.at[1]); y1 = Math.max(y1, s.at[1]);
  }
  const pad = 14;
  const sc = Math.min((w - pad * 2) / (x1 - x0), (h - pad * 2) / (y1 - y0));
  const mx = (x) => (x - (x0 + x1) / 2) * sc + w / 2;
  const my = (y) => (y - (y0 + y1) / 2) * sc + h / 2;
  mapCtx.globalAlpha = clamp01((world - 0.3) / 0.4);
  mapCtx.fillStyle = 'rgba(6,10,18,0.6)';
  mapCtx.fillRect(0, 0, w, h);
  mapCtx.strokeStyle = 'rgba(150,178,214,0.24)';
  mapCtx.lineWidth = 1;
  mapCtx.strokeRect(0.5, 0.5, w - 1, h - 1);
  for (const e of DATA.edges) {
    const a = byId[e.a], b = byId[e.b];
    mapCtx.beginPath();
    mapCtx.moveTo(mx(a.at[0]), my(a.at[1]));
    mapCtx.lineTo(mx(b.at[0]), my(b.at[1]));
    mapCtx.stroke();
  }
  for (const s of stars) {
    const here = inStar === s;
    mapCtx.fillStyle = here ? '#ffffff' : s.tint;
    mapCtx.beginPath();
    mapCtx.arc(mx(s.at[0]), my(s.at[1]), here ? 3.4 : 2, 0, 6.283185);
    mapCtx.fill();
    if (here) {
      mapCtx.strokeStyle = 'rgba(255,255,255,0.55)';
      mapCtx.beginPath();
      mapCtx.arc(mx(s.at[0]), my(s.at[1]), 7.5, 0, 6.283185);
      mapCtx.stroke();
      mapCtx.strokeStyle = 'rgba(150,178,214,0.24)';
    }
  }
  mapCtx.globalAlpha = 1;
}

/* ================================================================== control
 * Drag looks around, the wheel moves you forward. Not pan and zoom: those are
 * the verbs of a map, and this is not a map.
 */
let hover = null;
let readNow = null;
let drag = null;
const touches = new Map();
let pinch = null;

function showRead(text) {
  if (readNow === text) return;
  readNow = text;
  readEl.textContent = text || '';
  readEl.classList.toggle('on', !!text);
}

function starAt(px, py) {
  if (world > 0.3 || trip) return null;
  let best = null, bd = 1e9;
  for (const s of stars) {
    const p = project(s.at[0], s.at[1], s.at[2]);
    if (!p) continue;
    const d = Math.hypot(p.x - px, p.y - py);
    if (d < 64 && d < bd) { bd = d; best = s; }
  }
  return best;
}

function markAt(px, py) {
  if (!inStar || assembly < 0.9) return null;
  let best = null, bd = 1e9;
  for (const m of inStar.marks) {
    if (!m.t) continue;
    const p = project(inStar.at[0] + m.x * CHART_R, inStar.at[1] + m.y * CHART_R, inStar.at[2]);
    if (!p) continue;
    const hw = (m.k === 'r' ? m.w / 2 : m.r) * CHART_R * p.k;
    const hh = (m.k === 'r' ? m.h / 2 : m.r) * CHART_R * p.k;
    const d = Math.hypot(Math.max(0, Math.abs(px - p.x) - hw), Math.max(0, Math.abs(py - p.y) - hh));
    if (d < 12 && d < bd) { bd = d; best = m; }
  }
  return best;
}

function setHover(s) {
  if (hover === s) return;
  hover = s;
  stage.classList.toggle('over', !!s);
  if (!s) { tip.classList.remove('on'); return; }
  const p = project(s.at[0], s.at[1], s.at[2]);
  if (!p) { tip.classList.remove('on'); return; }
  tip.style.left = p.x + 'px';
  tip.style.top = (p.y - 26) + 'px';
  tip.innerHTML = '';
  tip.append(document.createTextNode(s.q));
  const sm = document.createElement('small');
  sm.textContent = s.cat;
  tip.append(sm);
  tip.classList.add('on');
}

stage.addEventListener('pointerdown', (e) => {
  stage.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, e);
  drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch, moved: 0, id: e.pointerId };
  idle = 0;
});
stage.addEventListener('pointermove', (e) => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, e);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinch) pinch = { d, z: cam.z };
    else dolly((pinch.d - d) * 14);
    drag = null;
    return;
  }
  if (drag && e.pointerId === drag.id && !trip) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
    if (drag.moved > 3) {
      const lock = inStar ? 0.16 : 1;          // inside a chart, only a lean
      cam.yaw = drag.yaw - dx * 0.0016 * lock;
      cam.pitch = drag.pitch + dy * 0.0013 * lock;
      cam.pitch = Math.max(-1.2, Math.min(1.2, cam.pitch));
      setHover(null);
      idle = 0;
    }
    return;
  }
  const m = markAt(e.clientX, e.clientY);
  if (m) { showRead(m.t); stage.classList.add('over'); setHover(null); return; }
  showRead(null);
  setHover(starAt(e.clientX, e.clientY));
});

function endDrag(e) {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  if (!drag) return;
  const quiet = drag.moved < 5;
  drag = null;
  if (!quiet || trip) return;
  if (markAt(e.clientX, e.clientY)) return;
  const s = starAt(e.clientX, e.clientY);
  if (s) { setHover(null); travel(s); }
  else if (inStar) travel(null);
}
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);
stage.addEventListener('pointerleave', (e) => { touches.delete(e.pointerId); setHover(null); showRead(null); });

/** Move along the way the camera is facing. */
function dolly(amount) {
  if (trip) return;
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
  const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  cam.x += sy * cp * amount;
  cam.y += -sp * amount;
  cam.z += cy * cp * amount;
  idle = 0;
}
stage.addEventListener('wheel', (e) => {
  e.preventDefault();
  dolly(-e.deltaY * 3.2);
}, { passive: false });

addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && inStar && !trip) travel(null);
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !trip) {
    const i = inStar ? stars.indexOf(inStar) : -1;
    const n = stars.length;
    travel(stars[e.key === 'ArrowRight' ? (i + 1 + n) % n : (i - 1 + n) % n]);
  }
});

mapCv.addEventListener('click', (e) => {
  if (trip) return;
  const r = mapCv.getBoundingClientRect();
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const s of stars) {
    x0 = Math.min(x0, s.at[0]); x1 = Math.max(x1, s.at[0]);
    y0 = Math.min(y0, s.at[1]); y1 = Math.max(y1, s.at[1]);
  }
  const pad = 14;
  const sc = Math.min((r.width - pad * 2) / (x1 - x0), (r.height - pad * 2) / (y1 - y0));
  let best = null, bd = 1e9;
  for (const s of stars) {
    const d = Math.hypot((s.at[0] - (x0 + x1) / 2) * sc + r.width / 2 - (e.clientX - r.left),
                         (s.at[1] - (y0 + y1) / 2) * sc + r.height / 2 - (e.clientY - r.top));
    if (d < bd) { bd = d; best = s; }
  }
  if (best && bd < 26 && best !== inStar) travel(best);
  else travel(null);
});

/* ================================================================== startup */
function wordmark() {
  const el = document.getElementById('wordmark');
  const small = innerWidth <= 700;
  const sizes = small ? [9, 10.5, 12, 13.5, 15, 17, 19, 22, 25] : [11, 13, 15, 17, 19, 22, 25, 28, 32];
  [...'MAGNITUDE'].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.fontSize = sizes[i] + 'px';
    el.append(s);
  });
}
function keyboardList() {
  const nav = document.getElementById('sr');
  for (const s of stars) {
    const b = document.createElement('button');
    b.textContent = s.q + ' — ' + s.cat;
    b.addEventListener('click', () => travel(s));
    nav.append(b);
  }
}
function size() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  glowCv.width = Math.max(1, (W * DPR) / 3 | 0);
  glowCv.height = Math.max(1, (H * DPR) / 3 | 0);
  const narrow = W <= 700;
  CHROME_TOP = narrow ? 172 : 108;
  CHROME_BOTTOM = narrow ? 96 : 72;
  FOCAL = Math.min(W, H) * 1.15;
  cam.focal = FOCAL;
  const r = mapBox.getBoundingClientRect();
  mapCv.width = r.width * DPR; mapCv.height = r.height * DPR;
  mapCv.style.width = r.width + 'px'; mapCv.style.height = r.height + 'px';
  if (inStar && !trip) Object.assign(cam, readCam(inStar));
}

for (const s of stars) {
  let far = 0;
  for (const m of s.marks) far = Math.max(far, Math.hypot(m.x, m.y));
  s.marks.forEach((m, i) => {
    m.d = far ? Math.hypot(m.x, m.y) / far : 0;
    m.lag = 0.34 * m.d + 0.12 * ((i * 2654435761) % 1000) / 1000;
    m.zo = (((i * 40503) % 1000) / 1000 - 0.5) * 2400;
  });
  s.cloud = null;
}

wordmark();
keyboardList();
size();
paintGrain();
buildField();
buildClouds();
buildMotes();
for (const s of stars) s.cloud = paintCloud(hueOf(s.tint), 640);
addEventListener('resize', size);

function hueOf(hex) {
  const [r, g, b] = hexRGB(hex).map((v) => v / 255);
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 210;
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
}

// The first thing you see is the approach, not the destination.
{
  const home = skyCam();
  Object.assign(cam, home, { z: home.z - 46000, yaw: 0.5, pitch: -0.16 });
  prev = { x: cam.x, y: cam.y, z: cam.z };
  if (reduced) { Object.assign(cam, home); }
  else setTimeout(() => travel(null), 240);
}
requestAnimationFrame(frame);

</script>
