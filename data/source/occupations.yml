# Selección curada de oficios.
#
# Nivel: subgrupos principales de la CNO-11, la máxima desagregación para la que el
# INE publica distribución salarial. Por debajo (subgrupos de 3 dígitos, grupos
# primarios de 4) no hay dato: quien enseña "el sueldo del piloto de aviación" está
# mostrando la cifra de su subgrupo padre reetiquetada. Aquí no se hace eso.
#
# `ine` es el nombre EXACTO de la serie en la tabla 36830 y es la clave con la que
# build_dataset.py la localiza; este fichero se genera resolviendo cada nombre contra
# el crudo descargado, así que no puede haber erratas. La tabla no publica los códigos
# CNO, sólo los nombres, de modo que aquí no se muestra ningún código: sería
# inventárselo.
#
# `id`     clave interna estable (la página la usa para recordar la selección)
# `label`  nombre corto que se pinta en el gráfico
# `family` agrupación de color

meta:
  classification: CNO-11
  level: subgrupos principales
  note: >
    La encuesta cubre asalariados por cuenta ajena. Quedan fuera los autónomos, y con
    ellos los subgrupos de propietarios (camareros y comerciantes propietarios),
    además del empleo doméstico y las ocupaciones militares, sin dato publicado.

families:
  direccion:      Dirección
  profesional:    Profesiones con titulación superior
  tecnico:        Técnicos y profesionales de apoyo
  administrativo: Empleo administrativo
  servicios:      Servicios, comercio y cuidados
  oficios:        Oficios cualificados
  elemental:      Ocupaciones elementales

